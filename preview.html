<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Test Todos Preview</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
  }
  h1 {
    font-size: 20px;
  }
  ul {
    list-style: none;
    padding: 0;
  }
  li {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 8px;
  }
  #status {
    color: #666;
  }
</style>
</head>
<body>
  <h1>test_todos 목록</h1>
  <p id="status">불러오는 중...</p>
  <ul id="todo-list"></ul>

  <script>
    const SUPABASE_URL = "https://pfhbnvkaecfzbfucorrs.supabase.co/rest/v1/";
    const SUPABASE_API_KEY = "sb_publishable_w-nRXGPhlI0sZiYN0b7D-g_CdFQLd4G";

    async function loadTodos() {
      const statusEl = document.getElementById("status");
      const listEl = document.getElementById("todo-list");

      try {
        const res = await fetch(SUPABASE_URL + "test_todos?select=*", {
          headers: {
            apikey: SUPABASE_API_KEY,
            Authorization: "Bearer " + SUPABASE_API_KEY,
          },
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        const todos = await res.json();

        if (todos.length === 0) {
          statusEl.textContent = "데이터가 없습니다.";
          return;
        }

        statusEl.remove();
        todos.forEach((todo) => {
          const li = document.createElement("li");
          li.textContent = JSON.stringify(todo);
          listEl.appendChild(li);
        });
      } catch (err) {
        statusEl.textContent = "불러오기 실패: " + err.message;
      }
    }

    loadTodos();
  </script>
</body>
</html>
